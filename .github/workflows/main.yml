name: Ubuntu Cloud PC (Pagekite Fixed)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install Desktop Environment & RDP Server
      run: |
        sudo apt update
        # Install XFCE Desktop and XRDP (Remote Desktop Protocol)
        sudo apt install -y xfce4 xfce4-goodies xrdp
        # Configure XRDP to use XFCE
        echo "xfce4-session" > ~/.xsession
        # Set login password for the runner user
        echo "runner:Password123" | sudo chpasswd
        sudo systemctl restart xrdp

    - name: Install Official Pagekite Client
      run: |
        # Install pagekite natively from official Ubuntu mirrors
        sudo apt install -y pagekite

    - name: Start Cloud PC Tunnel & Print URL
      run: |
        # 1. AUTHENTICATE YOUR PAGEKITE ACCOUNT
        # REPLACE 'Aetherone.pagekite.me' with your kite name if different
        # REPLACE 'YOUR_PAGEKITE_SECRET_KEY' with the key emailed to you by Pagekite
        pagekite --clean --add Aetherone.pagekite.me +654754
        
        # 2. START THE TUNNEL (FIXED: Using 'pagekite' binary command instead of pagekite.py)
        pagekite 3389 Aetherone.pagekite.me &
        
        # Give the tunnel 5 seconds to boot up
        sleep 5
        
        echo "=========================================="
        echo "YOUR RDP ADDRESS IS: Aetherone.pagekite.me"
        echo "=========================================="
        
        # Keep the machine alive for 6 hours
        sleep 21600
