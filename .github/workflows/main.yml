name: Ubuntu Cloud PC

on: 
  workflow_dispatch: # Run manually with a button click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clean Old Repos & Install Desktop
      run: |
        # REMOVE COPIES OF THE OLD BROKEN AMAZON/NGROK LISTS
        sudo rm -f /etc/apt/sources.list.d/ngrok.list
        sudo rm -f /etc/apt/sources.list.p/ngrok.list
        
        sudo apt update
        # Install XFCE Desktop and XRDP (Remote Desktop Protocol)
        sudo apt install -y xfce4 xfce4-goodies xrdp
        # Configure XRDP to use XFCE
        echo "xfce4-session" > ~/.xsession
        # Set a password for the 'runner' user
        echo "runner:Password123" | sudo chpasswd
        sudo systemctl restart xrdp

    - name: Download & Install Ngrok Official
      run: |
        # Download official Ngrok binary directly to bypass APT repository headaches entirely
        curl -s https://equinox.io -o ngrok.tgz
        sudo tar -xzf ngrok.tgz -C /usr/local/bin
        rm ngrok.tgz

    - name: Start Cloud PC Tunnel & Print URL
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # Connect to your Ngrok account
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        
        # Start the tunnel in the background for RDP (Port 3389)
        ngrok tcp 3389 &
        
        # Wait 5 seconds for the connection to secure
        sleep 5
        
        # Print the live RDP link clearly in your GitHub logs
        echo "=========================================="
        echo "YOUR REMOTE DESKTOP ADDRESS IS BELOW:"
        curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "=========================================="
        
        # Keep the machine alive for 6 hours
        sleep 21600 
