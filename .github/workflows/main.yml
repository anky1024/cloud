name: Ubuntu Cloud PC (Card-Free Fixed)

on: 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install Desktop Environment & RDP Server
      run: |
        sudo apt update
        # Install XFCE Desktop and XRDP
        sudo apt install -y xfce4 xfce4-goodies xrdp
        echo "xfce4-session" > ~/.xsession
        echo "runner:Password123" | sudo chpasswd
        sudo systemctl restart xrdp

    - name: Download & Extract Localtonet Client
      run: |
        # Download the correct Linux x64 tarball archive
        curl -L https://localtonet.com -o localtonet.tar.gz
        
        # Extract the binary using tar instead of unzip
        tar -xzf localtonet.tar.gz
        
        # Ensure executable permissions are assigned
        chmod +x localtonet

    - name: Start Cloud PC Tunnel
      run: |
        # Run Localtonet client in the background using your free auth token
        # REPLACE 'YOUR_LOCALTONET_AUTH_TOKEN' WITH THE TOKEN FROM YOUR DASHBOARD
        ./localtonet -token SzLfZAPg6yalvtKxMhDenrd0Cjq4pm52N &
        
        # Keep the session online for up to 6 hours
        sleep 21600 
