name: Ubuntu Cloud PC

on: 
  workflow_dispatch: # Run manually with a button click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clean Old Repos & Install Desktop
      run: |
        # Wipe old corrupted repository records if any persist
        sudo rm -f /etc/apt/sources.list.d/ngrok.list
        sudo rm -f /etc/apt/sources.list.p/ngrok.list
        
        sudo apt update
        # Install XFCE Desktop and XRDP (Remote Desktop Protocol)
        sudo apt install -y xfce4 xfce4-goodies xrdp
        # Configure XRDP to use XFCE
        echo "xfce4-session" > ~/.xsession
        # Set a password for the remote 'runner' account
        echo "runner:Password123" | sudo chpasswd
        sudo systemctl restart xrdp

    - name: Download & Install Ngrok Official
      run: |
        # FIXED: Using official verified Ngrok CDN link with automatic extraction 
        curl -fsSL https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar -xz -C /usr/local/bin

    - name: Start Cloud PC Tunnel & Print URL
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # Authorize Ngrok
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        
        # Start the background tunnel routing RDP traffic (Port 3389)
        ngrok tcp 3389 &
        
        # Wait for initialization
        sleep 5
        
        # Fetch the address directly from Ngrok's local interface
        echo "=========================================="
        echo "YOUR REMOTE DESKTOP ADDRESS IS BELOW:"
        curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url'
        echo "=========================================="
        
        # Keep the session online for up to 6 hours
        sleep 21600 
