name: Ubuntu Cloud PC

on: 
  workflow_dispatch: # Allows you to start the PC manually with a button click

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Install Desktop Environment & RDP Server
      run: |
        sudo apt update
        # Install XFCE Desktop and XRDP (Remote Desktop Protocol)
        sudo apt install -y xfce4 xfce4-goodies xrdp
        # Configure XRDP to use XFCE
        echo "xfce4-session" > ~/.xsession
        # Set a password for the 'runner' user (default GitHub runner user)
        echo "runner:Password123" | sudo chpasswd
        sudo systemctl restart xrdp

    - name: Download & Install Ngrok
      run: |
        curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.p/ngrok.list
        sudo apt update && sudo apt install ngrok

    - name: Start Cloud PC Tunnel
      env:
        NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
      run: |
        # Connect to your Ngrok account
        ngrok config add-authtoken $NGROK_AUTH_TOKEN
        # Create a tunnel for RDP (Port 3389) with your custom hostname/subdomain
        # Replace 'my-custom-pc-name' with your desired hostname (Requires an Ngrok static domain)
        ngrok tcp 3389 --domain=my-custom-pc-name.ngrok-free.app &
        
        # Keeps the GitHub Action running for 6 hours so it doesn't close
        sleep 21600 
